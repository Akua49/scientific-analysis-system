openapi: 3.0.3
info:
  title: Scirevia Server API
  version: 0.1.0-draft
  description: |
    Draft contract between the web client and the Node.js/Express server (ADR-001, ADR-003).
    Status: draft for pre-defense 1 (SCI-9). Field names may change before implementation (SCI-18).
servers:
  - url: http://localhost:3000/api
    description: Local development (Docker Compose)
tags:
  - name: auth
  - name: documents
  - name: checks
  - name: templates
  - name: topics
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register with an AITU e-mail (FR-70)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email, example: student@astanait.edu.kz }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: E-mail already registered }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in and receive a JWT (FR-70, NFR-09)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /documents:
    post:
      tags: [documents]
      summary: Upload a DOCX or text PDF up to 20 MB (FR-01)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded; structure extraction started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: File larger than 20 MB }
        '415': { description: Unsupported file type }
    get:
      tags: [documents]
      summary: List the user's documents (FR-62)
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }

  /documents/{documentId}/structure:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Extracted structure — title, abstract, citations, references (FR-02)
      responses:
        '200':
          description: Structure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStructure' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documents]
      summary: Correct abstract or reference-list boundaries (FR-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentStructure' }
      responses:
        '200': { description: Structure updated }

  /checks:
    post:
      tags: [checks]
      summary: Start a check job (FR-01, FR-40, NFR-05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
            example:
              documentId: "6531a2f0c1"
              checks: [references, citations, abstract, requirements, topic]
              templateId: aitu-diploma
              customRequirements: ["Each objective has a result in the conclusion"]
              llmConsent: false
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, example: j_812 }
                  status: { $ref: '#/components/schemas/JobStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /checks/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [checks]
      summary: Job status and progress per check, polled every ≤ 5 s (FR-63)
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checks/{jobId}/report:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [checks]
      summary: Single report with a section per check (FR-60)
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '409': { description: Job not finished yet }

  /checks/{jobId}/report.pdf:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [checks]
      summary: Export report to PDF (FR-61)
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /checks/{jobId}/share:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [checks]
      summary: Share a report with a supervisor (FR-71)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supervisorEmail]
              properties:
                supervisorEmail: { type: string, format: email }
      responses:
        '204': { description: Shared }
        '403': { $ref: '#/components/responses/Forbidden' }

  /templates:
    get:
      tags: [templates]
      summary: List requirement templates (FR-43)
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RequirementTemplate' }
    post:
      tags: [templates]
      summary: Save a requirement template (FR-43)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementTemplate' }
      responses:
        '201': { description: Saved }

  /admin/topics/import:
    post:
      tags: [topics]
      summary: Admin uploads the archive of past topics, CSV/XLSX (FR-51)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202': { description: Import started; topic index will be rebuilt }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Action not allowed for this role (FR-70)
    NotFound:
      description: Not found

  schemas:
    Role:
      type: string
      enum: [student, supervisor, admin]
    CheckType:
      type: string
      enum: [references, citations, abstract, requirements, topic]
    JobStatus:
      type: string
      enum: [queued, running, done, failed]
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    Document:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        language: { type: string, enum: [ru, kk, en] }
        pages: { type: integer }
        uploadedAt: { type: string, format: date-time }
    Reference:
      type: object
      properties:
        index: { type: integer }
        raw: { type: string }
        doi: { type: string, nullable: true }
        url: { type: string, nullable: true }
    Citation:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        refIndex: { type: integer }
    DocumentStructure:
      type: object
      properties:
        title: { type: string }
        abstract: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        references:
          type: array
          items: { $ref: '#/components/schemas/Reference' }
    RequirementTemplate:
      type: object
      properties:
        id: { type: string, example: aitu-diploma }
        name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: minReferences }
              value: {}
              text: { type: string }
    CheckRequest:
      type: object
      required: [documentId, checks]
      properties:
        documentId: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckType' }
        templateId: { type: string, nullable: true }
        customRequirements:
          type: array
          items: { type: string }
        llmConsent:
          type: boolean
          default: false
          description: Text is sent to an external LLM only when true (NFR-05)
    CheckJob:
      type: object
      properties:
        jobId: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress:
          type: object
          additionalProperties: { $ref: '#/components/schemas/JobStatus' }
          example: { references: done, citations: running, abstract: queued }
    Report:
      type: object
      properties:
        jobId: { type: string }
        documentId: { type: string }
        summary:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, warning, problem, failed] }
              issues: { type: integer }
        sections:
          type: object
          description: One section per selected check; structure as returned by the analysis service
          additionalProperties: true
